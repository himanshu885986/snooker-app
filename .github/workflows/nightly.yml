# Every night: an encrypted backup of the database, then clean-up of old personal data
# (run_retention in supabase/migrations/006_privacy.sql). Setup: see README → "Nightly backup".
name: Nightly backup and data clean-up

on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch: {}   # "Run workflow" button, to test it

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets (README → Nightly backup)."
            exit 1
          fi

      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Back up the database (encrypted)
        run: |
          set -o pipefail
          file="playkhata-$(date -u +%F).sql.gz.gpg"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "$file"
          ls -lh "$file"

      - name: Keep the backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: playkhata-*.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error

      - name: Clean up old personal data
        run: /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select run_retention()"
